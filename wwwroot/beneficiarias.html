<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIBAM - Beneficiarias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- MENÚ -->

            <aside class="col-md-3 col-lg-2 sidebar">

                <div class="sidebar-title">
                    SIBAM
                </div>

                <div class="sidebar-subtitle">
                    Sistema de Bonos de Apoyo a Mujeres
                </div>

                <hr>

                <nav>

                    <a href="/dashboard.html" class="menu-item">
                        <i class="bi bi-speedometer2"></i>
                        <span>Inicio</span>
                    </a>

                    <a href="/beneficiarias.html" class="menu-item">
                        <i class="bi bi-people"></i>
                        <span>Beneficiarias</span>
                    </a>

                    <a href="/importar.html" class="menu-item">
                        <i class="bi bi-file-earmark-excel"></i>
                        <span>Importar Excel</span>
                    </a>

                    <a href="/turnos.html" class="menu-item">
                        <i class="bi bi-ticket-perforated"></i>
                        <span>Generar turno</span>
                    </a>

                    <a href="/turnos-asignados.html" class="menu-item">
                        <i class="bi bi-list-check"></i>
                        <span>Turnos asignados</span>
                    </a>

                    <a href="/entregas.html" class="menu-item">
                        <i class="bi bi-cash-stack"></i>
                        <span>Entregas</span>
                    </a>

                    <a href="/historial.html" class="menu-item">
                        <i class="bi bi-clock-history"></i>
                        <span>Historial</span>
                    </a>

                </nav>

                <div class="logout-container">

                    <button class="btn btn-outline-light w-100"
                            onclick="cerrarSesion()">

                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión

                    </button>

                </div>

            </aside>


            <!-- CONTENIDO -->

            <main class="col-md-9 col-lg-10 main-content">

                <div class="topbar">

                    <div>

                        <h2>
                            Beneficiarias
                        </h2>

                        <p class="text-muted mb-0">
                            Consulta y validación de beneficiarias
                        </p>

                    </div>

                    <div class="user-info">

                        👤
                        <span id="nombreUsuario">
                            Usuario
                        </span>

                    </div>

                </div>


                <!-- BÚSQUEDA -->

                <div class="info-card mt-4">

                    <h4>
                        Buscar beneficiaria
                    </h4>

                    <div class="row mt-3">

                        <div class="col-md-9">

                            <input type="text"
                                   id="buscarDPI"
                                   class="form-control"
                                   placeholder="Ingrese el DPI">

                        </div>

                        <div class="col-md-3 mt-2 mt-md-0">

                            <button class="btn btn-primary w-100"
                                    onclick="buscarBeneficiaria()">

                                <i class="bi bi-search"></i>
                                Buscar


                            </button>

                        </div>

                    </div>

                    <div id="mensajeBusqueda"
                         class="mt-3">
                    </div>

                </div>


                <!-- TABLA -->

                <div class="info-card mt-4">

                    <div class="d-flex justify-content-between
                                align-items-center mb-3">

                        <h4 class="mb-0">
                            Beneficiarias registradas
                        </h4>

                        <button class="btn btn-secondary"
                                onclick="cargarBeneficiarias()">

                            <i class="bi bi-check-circle"></i> Actualizar

                        </button>

                    </div>


                    <div class="table-responsive">

                        <table class="table table-hover">

                            <thead>

                                <tr>

                                    <th>DPI</th>

                                    <th>Nombre</th>

                                    <th>Teléfono</th>

                                    <th>Integrantes</th>

                                    <th>Monto</th>

                                    <th>Estado</th>

                                </tr>

                            </thead>

                            <tbody id="tablaBeneficiarias">
                            </tbody>

                        </table>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <script src="js/beneficiarias.js"></script>

</body>

</html>
